services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    build: ./collector
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      SYMBOLS: btcusdt,ethusdt,bnbusdt,solusdt,xrpusdt

volumes:
  mongo_data:
