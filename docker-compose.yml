services:
  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  collector:
    build: ./collector
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017
      SYMBOLS: btcusdt,ethusdt,bnbusdt,solusdt,xrpusdt

  loader:                       # carga histórica única (la ejecuta setup.sh)
    build: ./collector
    profiles: ["load"]
    depends_on:
      mongo:
        condition: service_healthy
    command: ["python", "-u", "loader.py"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      SYMBOLS: btcusdt,ethusdt,bnbusdt,solusdt,xrpusdt
      TARGET_DOCS: ${TARGET_DOCS:-10000000}

  recolector:                   # consumo en vivo con límite SUMAR (lo ejecuta scripts/recolectar.sh)
    build: ./collector
    profiles: ["live"]
    depends_on:
      mongo:
        condition: service_healthy
    command: ["python", "-u", "recolectar.py"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      SYMBOLS: btcusdt,ethusdt,bnbusdt,solusdt,xrpusdt
      SUMAR:                    # sin valor aquí: lo fija scripts/recolectar.sh

volumes:
  mongo_data:
